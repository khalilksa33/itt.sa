services:
  # Unified Web App: Nginx + PHP-FPM in a single container
  itt-app:
    image: khalilksa33/itt.sa:latest
    container_name: insight-travel-app
    ports:
      - "8080:80"
    restart: always

  # Express Backend with MongoDB Integration
  itt-backend:
    image: node:18-alpine
    container_name: insight-travel-backend
    working_dir: /app
    volumes:
      - ./server:/app
    command: sh -c "npm install && npm start"
    ports:
      - "5000:5000"
    restart: always
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://192.168.8.59:27017/itt_sa
