name: DEV CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to Local Dev Directory
        run: |
          mkdir -p ~/itt.sa-dev
          rsync -av --delete --exclude='.git' --exclude='node_modules' ./ ~/itt.sa-dev/

      - name: Build and Restart Docker Compose Services
        run: |
          cd ~/itt.sa-dev
          docker rm -f insight-travel-app-dev insight-travel-backend-dev insight-travel-db-dev || true
          docker compose down || true
          APP_PORT=8099 BACKEND_PORT=5099 docker compose up -d --build --remove-orphans
