name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            khalilksa33/itt.sa:latest
            khalilksa33/itt.sa:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to Production and Deploy
        run: |
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          {
            echo "=== Deployment Run ==="
            date
            echo "Syncing workspace code to /home/frappe/itt.sa..."
            rsync -av --exclude='.git' --exclude='node_modules' ./ /home/frappe/itt.sa/
            
            echo "Deploying containers..."
            cd /home/frappe/itt.sa
            docker compose pull
            docker compose up -d --remove-orphans
            echo "=== Deployment Finished ==="
          } > /home/frappe/itt.sa/deploy_step.log 2>&1
