name: DEV CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            khalilksa33/itt.sa-dev:latest
            khalilksa33/itt.sa-dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: [self-hosted, itt.sa-dev]
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to Host B and Deploy
        run: |
          export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
          mkdir -p /home/iicc2/itt.sa-dev
          
          echo "=== Syncing Workspace ==="
          rsync -av --exclude='.git' --exclude='node_modules' ./ /home/iicc2/itt.sa-dev/
          
          echo "=== Deploying DEV Containers on Port 8095 ==="
          cd /home/iicc2/itt.sa-dev
          docker compose down || true
          docker compose pull
          docker compose up -d --remove-orphans
          echo "=== DEV Deployment Finished ==="
